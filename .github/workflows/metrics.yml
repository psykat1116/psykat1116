name: Metrics

on:
  workflow_dispatch:
  schedule:
    # Runs once a day at midnight UTC — change the cron if you want it more/less often
    - cron: "0 0 * * *"
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Card 1: stats overview, saved as github-metrics.svg — dark "terminal" theme
      - name: Generate stats card
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          template: terminal
          base: header, activity, community, repositories, metadata
      - name: Generate languages card
        uses: lowlighter/metrics@latest
        with:
          filename: github-languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          template: terminal
          base: ""
          plugin_languages: yes
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_threshold: 0%